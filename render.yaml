# Render Blueprint for Meru Core (api.meru.com)
# Deploys the NestJS backend as a persistent web service (keeps BullMQ
# workers + @nestjs/schedule cron running, unlike serverless).
#
# Usage: push to GitHub, then Render Dashboard -> New -> Blueprint -> pick repo.
# Set the secret env vars (marked sync:false) in the Render dashboard.
services:
  - type: web
    name: meru-core-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: VERTICAL
        value: core
      # --- Supabase Postgres (transaction pooler) ---
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: 6543
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        value: postgres
      # --- Supabase API ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # --- Auth / app secrets ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1h
      - key: DOCUMENT_ENCRYPTION_KEY
        generateValue: true
      # --- CORS (set to your frontend origins) ---
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.immistack.com,https://app.governancex.com
      # --- Optional integrations ---
      - key: OPENAI_API_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET
        value: meru-documents
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SKIP_CONFIG_PACK_LOADER
        value: false
